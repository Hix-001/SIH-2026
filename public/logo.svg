  <circle cx="50" cy="20" r="3.5" fill="#f5c842"/>
  
  <!-- Scale Beam -->
  <path d="M26 30 L74 30" stroke="#f5c842" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Left Pan -->
