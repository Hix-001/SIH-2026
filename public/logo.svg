  <!-- Inner Judiciary Blue Background -->
  <circle cx="50" cy="50" r="42" fill="#1a237e" />
  
  <!-- Scale of Justice Base & Pillar -->
  <path d="M50 20 L50 72" stroke="#f5c842" stroke-width="3" stroke-linecap="round"/>
